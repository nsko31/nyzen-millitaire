
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NYZEN Militaire">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>NYZEN MILITAIRE — Entraînement</title>
<style>
:root {
  --bg:#0b1120;
  --panel:#172235;
  --panel2:#223249;
  --line:#35465e;
  --text:#f4f7fc;
  --muted:#abb8ca;
  --blue:#83b1ff;
  --green:#68dcaa;
  --red:#ff858a;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
}
button,select {font:inherit}
button {
  min-height:45px;
  padding:11px 15px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--panel2);
  color:var(--text);
  font-weight:650;
  cursor:pointer;
}
button:disabled {opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible {
  outline:3px solid var(--blue);
  outline-offset:3px;
}
button.primary {
  background:var(--blue);
  color:#0a1628;
  border-color:var(--blue);
}
button.selected {
  background:#314d75;
  outline:2px solid var(--blue);
}
button.ghost {background:transparent}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:15px 18px;
  padding-top:max(15px,env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
  background:var(--bg);
}
.brand {font-weight:900;letter-spacing:.04em}
.brand span {color:var(--blue)}
main {max-width:950px;margin:auto;padding:22px 15px 65px}
h1 {font-size:clamp(27px,5vw,39px);line-height:1.15;margin:8px 0 15px}
h2 {font-size:23px;margin:8px 0 15px}
h3 {margin:8px 0}
p {color:var(--muted)}
.small {font-size:13px;color:var(--muted)}
.panel {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  padding:20px;
  margin:15px 0;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
  gap:12px;
}
.exercise {
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:175px;
}
.exercise p {margin:5px 0 15px}
.row {display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between {justify-content:space-between}
.center {text-align:center}
.big {
  font-size:clamp(35px,9vw,64px);
  font-weight:850;
  text-align:center;
  margin:25px 0;
}
.rules {
  font-size:clamp(21px,5vw,29px);
  text-align:center;
  font-weight:750;
  line-height:1.65;
  padding:25px 10px;
}
.rules .sep {
  display:block;
  margin:12px auto;
  width:75%;
  border-top:1px solid var(--line);
}
.choices {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:10px;
  margin:17px 0;
}
.choice {min-height:62px;font-size:17px}
.word-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin:25px 0;
}
.word {
  background:var(--panel2);
  padding:20px 5px;
  border-radius:10px;
  text-align:center;
  font-size:clamp(14px,3vw,21px);
  font-weight:750;
  overflow-wrap:anywhere;
}
.spatial-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin:20px 0;
}
.spatial-option {
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px 5px;
  min-height:158px;
}
.arrow-pair {
  background:#f7f7f2;
  border-radius:8px;
  width:100%;
  height:112px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
}
.arrow-pair svg {width:48px;height:48px;display:block}
.cross {
  font-weight:850;
  font-size:18px;
  margin-top:5px;
}
.compare {
  display:grid;
  grid-template-columns:90px 1fr;
  gap:12px;
  align-items:center;
  padding:14px;
  margin:12px 0;
  background:var(--panel2);
  border-radius:12px;
}
.code-line {
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:clamp(21px,5vw,33px);
  font-weight:800;
  white-space:pre;
  letter-spacing:.05em;
}
.progress {
  height:8px;
  background:var(--panel2);
  border-radius:99px;
  overflow:hidden;
  margin:14px 0;
}
.progress div {height:100%;background:var(--blue)}
.clock {font-size:20px;font-weight:850;color:var(--blue)}
.feedback {
  padding:15px;
  border-radius:12px;
  margin:15px 0;
}
.correct {background:#164533;color:#b8ffdc}
.incorrect {background:#4b2831;color:#ffcad0}
select {
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  width:100%;
}
.setting-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.setting-grid label {font-size:13px;color:var(--muted)}
.setting-grid select {margin-top:5px}
.bottom {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:23px;
}
.bottom button {flex:1}
footer {
  color:var(--muted);
  font-size:12px;
  text-align:center;
  padding:20px;
}
@media(max-width:550px) {
  main {padding:17px 12px 55px}
  .panel {padding:15px}
  .setting-grid {grid-template-columns:1fr}
  .arrow-pair {height:102px}
  .arrow-pair svg {width:42px;height:42px}
  .spatial-option {padding:6px 3px;min-height:145px}
  .compare {grid-template-columns:65px 1fr;gap:7px}
  .code-line {letter-spacing:0}
  .choices {grid-template-columns:repeat(3,minmax(0,1fr))}
  .choice {font-size:15px;padding:8px 4px}
}
</style>
</head>
<body>

<header>
  <div class="brand">NYZEN <span>MILITAIRE</span></div>
  <button id="homeButton" class="ghost">Accueil</button>
</header>

<main id="app"></main>

<footer>
Application personnelle d'entraînement.
Les exercices générés ne sont pas des questions officielles.
</footer>

<script>
"use strict";

const app=document.getElementById("app");

const NAMES=[
  "Aisance numérique",
  "Orientation spatiale",
  "Mémoire des mots",
  "Raisonnement",
  "Détection d'erreurs"
];

const DESCRIPTIONS=[
  "Calcule deux opérations mentalement, mémorise les résultats et compare-les.",
  "Mémorise deux règles puis retrouve la bonne combinaison de flèches.",
  "Mémorise trois catégories et retrouve combien de mots correspondent.",
  "Lis deux phrases et déduis la bonne réponse parmi trois propositions.",
  "Compare deux lignes et indique le nombre d'erreurs."
];

const PREF_KEY="nyzen_militaire_preferences_v1";
const HISTORY_KEY="nyzen_militaire_history_v1";

function readStorage(key,fallback) {
  try {
    const value=localStorage.getItem(key);
    return value?JSON.parse(value):fallback;
  } catch(e) {
    return fallback;
  }
}
function writeStorage(key,value) {
  try {localStorage.setItem(key,JSON.stringify(value))}
  catch(e) {console.warn("Sauvegarde indisponible",e)}
}

let prefs=readStorage(PREF_KEY,{
  mode:"training",
  count:10,
  minutes:5
});
let history=readStorage(HISTORY_KEY,[]);
if(!Array.isArray(history))history=[];

let run=null;
let timer=null;

function rand(min,max) {
  return Math.floor(Math.random()*(max-min+1))+min;
}
function pick(array) {
  return array[rand(0,array.length-1)];
}
function shuffle(array) {
  const copy=[...array];
  for(let i=copy.length-1;i>0;i--) {
    const j=rand(0,i);
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}
function safe(value) {
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}
function stopTimer() {
  if(timer!==null)clearInterval(timer);
  timer=null;
}
function formatTime(seconds) {
  seconds=Math.max(0,Math.ceil(seconds));
  const m=Math.floor(seconds/60);
  const s=seconds%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function showHome() {
  stopTimer();
  run=null;

  const sessions=history.length;
  const best=history.length?
    Math.max(...history.map(x=>x.percent)):0;

  app.innerHTML=`
    <p class="small">PRÉPARATION PSYCHOTECHNIQUE</p>
    <h1>Prêt pour ta sélection ?</h1>
    <p>Entraîne-toi aux cinq exercices avec des questions renouvelées automatiquement.</p>

    <div class="panel row between">
      <div>
        <strong>${sessions} session(s)</strong>
        <div class="small">Meilleur score : ${best}%</div>
      </div>
      <button data-action="history">Historique</button>
    </div>

    <div class="panel">
      <h2>Paramètres d'entraînement</h2>
      <div class="setting-grid">
        <label>Mode
          <select data-setting="mode">
            <option value="training" ${prefs.mode==="training"?"selected":""}>
              Entraînement libre
            </option>
            <option value="exam" ${prefs.mode==="exam"?"selected":""}>
              Simulation chronométrée
            </option>
          </select>
        </label>
        <label>Questions par session
          <select data-setting="count">
            ${[5,10,20].map(n=>
              `<option value="${n}" ${Number(prefs.count)===n?"selected":""}>${n} questions</option>`
            ).join("")}
          </select>
        </label>
        <label>Temps en simulation
          <select data-setting="minutes">
            ${[3,5,10,15,20].map(n=>
              `<option value="${n}" ${Number(prefs.minutes)===n?"selected":""}>${n} minutes</option>`
            ).join("")}
          </select>
        </label>
      </div>
      <p class="small">
        Ces durées sont des réglages d'entraînement, pas des durées officielles.
      </p>
    </div>

    <h2>Choisis ton exercice</h2>
    <div class="grid">
      ${NAMES.map((name,i)=>`
        <div class="panel exercise">
          <div>
            <div class="small">TEST ${i+1}/5</div>
            <h3>${name}</h3>
            <p>${DESCRIPTIONS[i]}</p>
          </div>
          <button class="primary" data-action="start" data-index="${i}">
            Commencer
          </button>
        </div>
      `).join("")}
    </div>
  `;
}

function showHistory() {
  stopTimer();
  run=null;

  const items=[...history].reverse().map(h=>`
    <div class="panel row between">
      <div>
        <strong>${safe(h.name)}</strong>
        <div class="small">${safe(new Date(h.date).toLocaleString("fr-BE"))}</div>
        <div class="small">
          ${h.mode==="exam"?"Simulation":"Entraînement"}
          · ${h.answered}/${h.total} questions répondues
        </div>
      </div>
      <div style="text-align:right">
        <strong>${h.correct}/${h.total}</strong>
        <div class="small">${h.percent}%</div>
      </div>
    </div>
  `).join("");

  app.innerHTML=`
    <h1>Historique</h1>
    ${items||'<div class="panel"><p>Aucune session enregistrée.</p></div>'}
    <div class="row">
      <button class="primary" data-action="home">Retour</button>
      ${history.length?
        '<button data-action="clear-history">Effacer l’historique</button>':""}
    </div>
  `;
}

/* -----------------------------
   GÉNÉRATEUR 1 : CALCUL MENTAL
----------------------------- */

function mathOperation() {
  const type=pick(["+","-","×"]);
  let a,b,value;

  if(type==="+") {
    a=rand(2,55);
    b=rand(2,45);
    value=a+b;
  } else if(type==="-") {
    a=rand(15,99);
    b=rand(1,a-1);
    value=a-b;
  } else {
    a=rand(2,9);
    b=rand(2,9);
    value=a*b;
  }
  return {text:`${a} ${type} ${b}`,value};
}

function makeNumeric() {
  const first=mathOperation();
  let second=mathOperation();

  // Certaines questions comportent deux résultats égaux.
  if(Math.random()<0.23) {
    const n=rand(0,first.value);
    second={
      text:`${n} + ${first.value-n}`,
      value:first.value
    };
  }

  const answer=
    first.value>second.value?"haut":
    first.value<second.value?"bas":"egal";

  return {
    type:"numeric",
    first,second,answer,
    explanation:
      `Première opération : ${first.text} = ${first.value}. `+
      `Deuxième opération : ${second.text} = ${second.value}.`
  };
}

/* -----------------------------
   GÉNÉRATEUR 2 : FLÈCHES
----------------------------- */

const DIRECTIONS={
  NE:{name:"DROITE HAUT",angle:45},
  NW:{name:"GAUCHE HAUT",angle:-45},
  SE:{name:"DROITE BAS",angle:135},
  SW:{name:"GAUCHE BAS",angle:-135}
};
const DIR_KEYS=Object.keys(DIRECTIONS);

function makeSpatial() {
  const colors=shuffle(["black","yellow"]);
  const topColor=colors[0];
  const bottomColor=colors[1];
  const topDir=pick(DIR_KEYS);
  const bottomDir=pick(DIR_KEYS);

  const valid={
    topColor,bottomColor,topDir,bottomDir
  };

  const all=[];
  for(const colorPair of [
    ["black","yellow"],
    ["yellow","black"]
  ]) {
    for(const top of DIR_KEYS) {
      for(const bottom of DIR_KEYS) {
        const candidate={
          topColor:colorPair[0],
          bottomColor:colorPair[1],
          topDir:top,
          bottomDir:bottom
        };

        const identical=
          candidate.topColor===valid.topColor &&
          candidate.bottomColor===valid.bottomColor &&
          candidate.topDir===valid.topDir &&
          candidate.bottomDir===valid.bottomDir;

        if(!identical)all.push(candidate);
      }
    }
  }

  // Cinq mauvaises combinaisons différentes.
  const wrong=shuffle(all).slice(0,5);
  const correctIndex=rand(0,5);
  const options=[];
  let wrongIndex=0;

  for(let i=0;i<6;i++) {
    options.push(
      i===correctIndex?valid:wrong[wrongIndex++]
    );
  }

  const colorLabel=c=>c==="black"?"NOIR":"JAUNE";

  return {
    type:"spatial",
    topColor,bottomColor,topDir,bottomDir,
    options,
    answer:String(correctIndex),
    explanation:
      `${colorLabel(topColor)} au-dessus de ${colorLabel(bottomColor)}. `+
      `${DIRECTIONS[topDir].name} au-dessus de `+
      `${DIRECTIONS[bottomDir].name}. `+
      `La bonne réponse était la case ${correctIndex+1}.`
  };
}

function arrowSVG(color,direction) {
  const angle=DIRECTIONS[direction].angle;
  const fill=color==="black"?"#292e38":"#ffe349";

  return `
    <svg viewBox="0 0 80 80"
         xmlns="http://www.w3.org/2000/svg"
         aria-hidden="true">
      <g transform="rotate(${angle} 40 40)">
        <path d="M33 68 V32 H22 L40 11 L58 32 H47 V68 Z"
              fill="${fill}"
              stroke="#343944"
              stroke-width="2.5"
              stroke-linejoin="round"/>
      </g>
    </svg>
  `;
}

function arrowPair(option) {
  return `
    <div class="arrow-pair">
      ${arrowSVG(option.topColor,option.topDir)}
      ${arrowSVG(option.bottomColor,option.bottomDir)}
    </div>
  `;
}

/* -----------------------------
   GÉNÉRATEUR 3 : MÉMOIRE
----------------------------- */

const WORDS={
  "Pays":[
    "Belgique","France","Italie","Espagne",
    "Canada","Japon","Portugal","Suisse"
  ],
  "Vêtement":[
    "Chaussettes","Chemise","Pantalon","Veste",
    "Écharpe","Pull","Manteau","Jupe"
  ],
  "Animal":[
    "Chien","Chat","Cheval","Renard",
    "Lapin","Lion","Zèbre","Dauphin"
  ],
  "Fruit":[
    "Pomme","Poire","Banane","Orange",
    "Kiwi","Fraise","Mangue","Raisin"
  ],
  "Métier":[
    "Médecin","Boulanger","Pilote","Maçon",
    "Pompier","Facteur","Infirmier","Professeur"
  ]
};

function makeMemory() {
  const categories=Object.keys(WORDS);
  const rules=Array.from({length:3},()=>pick(categories));

  // Le nombre de bonnes correspondances varie de 0 à 3.
  const numberCorrect=rand(0,3);
  const matchingPositions=shuffle([0,1,2]).slice(0,numberCorrect);
  const words=[];

  for(let i=0;i<3;i++) {
    const matches=matchingPositions.includes(i);
    const category=matches?
      rules[i]:
      pick(categories.filter(c=>c!==rules[i]));

    let word=pick(WORDS[category]);
    while(words.includes(word))word=pick(WORDS[category]);
    words.push(word);
  }

  return {
    type:"memory",
    rules,words,
    answer:String(numberCorrect),
    explanation:
      rules.map((rule,i)=>
        `Position ${i+1} : ${words[i]} — catégorie attendue : ${rule}.`
      ).join(" ")
  };
}

/* -----------------------------
   GÉNÉRATEUR 4 : RAISONNEMENT
----------------------------- */

const PEOPLE=[
  "Alex","Bastien","Camille","Didier","Emma",
  "Farah","Hugo","Inès","Jules","Lucas",
  "Manon","Nicolas","Oscar","Sarah","Thomas"
];

const RELATIONS=[
  {
    more:"plus grand",
    less:"plus petit",
    max:"le plus grand",
    min:"le plus petit"
  },
  {
    more:"plus âgé",
    less:"plus jeune",
    max:"le plus âgé",
    min:"le plus jeune"
  },
  {
    more:"plus rapide",
    less:"plus lent",
    max:"le plus rapide",
    min:"le plus lent"
  }
];

function makeReasoning() {
  const [highest,middle,lowest]=shuffle(PEOPLE).slice(0,3);
  const rel=pick(RELATIONS);
  const reverse=Math.random()<0.5;
  const askHighest=Math.random()<0.5;

  const sentence1=reverse?
    `${middle} est ${rel.less} que ${highest}.`:
    `${highest} est ${rel.more} que ${middle}.`;

  const sentence2=reverse?
    `${lowest} est ${rel.less} que ${middle}.`:
    `${middle} est ${rel.more} que ${lowest}.`;

  const answer=askHighest?highest:lowest;
  const question=`Qui est ${askHighest?rel.max:rel.min} ?`;

  return {
    type:"reasoning",
    sentence1,sentence2,question,
    options:shuffle([highest,middle,lowest]),
    answer,
    explanation:
      `L'ordre déduit est : ${highest}, puis ${middle}, `+
      `puis ${lowest}, du niveau le plus élevé au plus faible.`
  };
}

/* -----------------------------
   GÉNÉRATEUR 5 : ERREURS
----------------------------- */

function makeErrors() {
  const letters="ABCDEFGHJKLMNPQRSTUVWXYZ";
  const digits="0123456789";

  const original=[
    pick([...letters]),
    pick([...letters]),
    pick([...letters]),
    " ",
    pick([...digits]),
    ",",
    pick([...digits]),
    pick([...digits])
  ];

  const copied=[...original];
  const errors=rand(0,4);

  // Chaque position est différente au maximum une fois.
  const positions=shuffle([0,1,2,4,6,7]).slice(0,errors);

  for(const position of positions) {
    const alphabet=position<3?letters:digits;
    const alternatives=[...alphabet].filter(c=>c!==original[position]);
    copied[position]=pick(alternatives);
  }

  return {
    type:"errors",
    original:original.join(""),
    copy:copied.join(""),
    positions,
    answer:String(errors),
    explanation:
      `${errors} erreur(s). `+
      (errors?
        `Positions modifiées : ${positions.map(p=>p+1).sort((a,b)=>a-b).join(", ")}.`:
        "Les deux lignes étaient identiques.")
  };
}

const GENERATORS=[
  makeNumeric,
  makeSpatial,
  makeMemory,
  makeReasoning,
  makeErrors
];

/* -----------------------------
   GESTION DES SESSIONS
----------------------------- */

function startTest(index) {
  stopTimer();

  run={
    type:index,
    mode:prefs.mode,
    total:Number(prefs.count),
    minutes:Number(prefs.minutes),
    index:0,
    phase:0,
    choice:null,
    question:null,
    feedback:false,
    answers:[],
    finished:false,
    started:Date.now(),
    deadline:Date.now()+Number(prefs.minutes)*60000
  };

  nextQuestion();

  if(run.mode==="exam") {
    timer=setInterval(updateTimer,250);
    updateTimer();
  }
}

function updateTimer() {
  if(!run||run.finished||run.mode!=="exam")return;

  const remaining=Math.ceil((run.deadline-Date.now())/1000);

  if(remaining<=0) {
    finish(true);
    return;
  }

  const clock=document.getElementById("clock");
  if(clock)clock.textContent=formatTime(remaining);
}

function nextQuestion() {
  if(!run||run.finished)return;

  if(run.index>=run.total) {
    finish(false);
    return;
  }

  run.question=GENERATORS[run.type]();
  run.phase=0;
  run.choice=null;
  run.feedback=false;

  renderTest();
}

function page(content,instruction) {
  const progress=run.answers.length/run.total*100;

  app.innerHTML=`
    <div class="row between">
      <div>
        <div class="small">
          QUESTION ${run.index+1} / ${run.total}
        </div>
        <h1>${NAMES[run.type]}</h1>
      </div>
      <div class="clock" id="clock">
        ${run.mode==="exam"?
          formatTime((run.deadline-Date.now())/1000):
          "LIBRE"}
      </div>
    </div>

    <div class="progress">
      <div style="width:${progress}%"></div>
    </div>

    <p>${instruction}</p>

    <div class="panel">
      ${content}
      <div class="bottom">
        <button class="ghost" data-action="quit">Quitter</button>
      </div>
    </div>
  `;

  updateTimer();
}

function nextButton(text="J'ai mémorisé — Suivant") {
  return `
    <div class="center">
      <button class="primary" data-action="advance">
        ${text}
      </button>
    </div>
  `;
}

function choices(options) {
  return `
    <div class="choices">
      ${options.map(option=>`
        <button
          class="choice ${run.choice===String(option.value)?"selected":""}"
          data-action="choose"
          data-value="${safe(option.value)}">
          ${safe(option.label)}
        </button>
      `).join("")}
    </div>
    <div class="center">
      <button class="primary"
              data-action="submit"
              ${run.choice===null?"disabled":""}>
        Valider ma réponse
      </button>
    </div>
  `;
}

function renderTest() {
  if(!run)return;
  if(run.feedback) {
    renderFeedback();
    return;
  }

  const q=run.question;
  let content="";
  let instruction="";

  if(q.type==="numeric") {
    if(run.phase===0) {
      instruction="Calcule et mémorise le résultat. Ne l'écris pas.";
      content=`
        <div class="small center">PREMIÈRE OPÉRATION</div>
        <div class="big">${q.first.text}</div>
        ${nextButton()}
      `;
    } else if(run.phase===1) {
      instruction="Mémorise également le résultat de cette deuxième opération.";
      content=`
        <div class="small center">DEUXIÈME OPÉRATION</div>
        <div class="big">${q.second.text}</div>
        ${nextButton("Comparer les deux résultats")}
      `;
    } else {
      instruction="Compare les deux résultats de mémoire. Les opérations ne sont plus visibles.";
      content=`
        <h2 class="center">Quel résultat est le plus grand ?</h2>
        ${choices([
          {value:"haut",label:"Ligne du haut"},
          {value:"egal",label:"Égales"},
          {value:"bas",label:"Ligne du bas"}
        ])}
      `;
    }
  }

  if(q.type==="spatial") {
    if(run.phase===0) {
      instruction="Mémorise les deux règles. Elles disparaîtront ensuite.";
      const colorName=c=>c==="black"?"NOIR":"JAUNE";

      content=`
        <div class="rules">
          <div>${colorName(q.topColor)}</div>
          <div>AU-DESSUS</div>
          <div>${colorName(q.bottomColor)}</div>
          <span class="sep"></span>
          <div>${DIRECTIONS[q.topDir].name}</div>
          <div>AU-DESSUS</div>
          <div>${DIRECTIONS[q.bottomDir].name}</div>
        </div>
        ${nextButton("Afficher les 6 combinaisons")}
      `;
    } else {
      instruction="Choisis la seule case qui respecte simultanément les deux règles.";

      content=`
        <div class="spatial-grid">
          ${q.options.map((option,i)=>`
            <button
              class="spatial-option ${run.choice===String(i)?"selected":""}"
              data-action="choose"
              data-value="${i}"
              aria-label="Choisir la combinaison ${i+1}">
              ${arrowPair(option)}
              <span class="cross">
                ${run.choice===String(i)?"✕":"□"}
              </span>
            </button>
          `).join("")}
        </div>
        <div class="center">
          <button class="primary"
                  data-action="submit"
                  ${run.choice===null?"disabled":""}>
            Valider ma combinaison
          </button>
        </div>
      `;
    }
  }

  if(q.type==="memory") {
    if(run.phase===0) {
      instruction="Mémorise l'ordre exact des trois catégories.";

      content=`
        <div class="rules">
          ${q.rules.map((r,i)=>`<div>${i+1}. ${safe(r)}</div>`).join("")}
        </div>
        ${nextButton("Afficher les trois mots")}
      `;
    } else {
      instruction="Les règles ont disparu. Compare les trois mots à leur position respective.";

      content=`
        <div class="word-grid">
          ${q.words.map(word=>`<div class="word">${safe(word)}</div>`).join("")}
        </div>
        <h3 class="center">
          Combien de mots correspondent aux règles ?
        </h3>
        ${choices([0,1,2,3].map(n=>({
          value:String(n),
          label:String(n)
        })))}
      `;
    }
  }

  if(q.type==="reasoning") {
    instruction="Lis les deux phrases puis tire la bonne conclusion.";

    content=`
      <div class="rules" style="font-size:21px">
        <div>${safe(q.sentence1)}</div>
        <br>
        <div>${safe(q.sentence2)}</div>
      </div>
      <h3 class="center">${safe(q.question)}</h3>
      ${choices(q.options.map(person=>({
        value:person,
        label:person
      })))}
    `;
  }

  if(q.type==="errors") {
    if(run.phase===0) {
      instruction="Compare les deux lignes, caractère par caractère, puis mémorise ton nombre d'erreurs.";

      content=`
        <div class="compare">
          <strong>Original</strong>
          <div class="code-line">${safe(q.original)}</div>
        </div>
        <div class="compare">
          <strong>Copie</strong>
          <div class="code-line">${safe(q.copy)}</div>
        </div>
        ${nextButton("Comparaison terminée — Suivant")}
      `;
    } else {
      instruction="Les lignes ont disparu. Indique le nombre d'erreurs comptées.";

      content=`
        <h2 class="center">Combien d'erreurs ?</h2>
        ${choices([0,1,2,3,4].map(n=>({
          value:String(n),
          label:String(n)
        })))}
      `;
    }
  }

  page(content,instruction);
}

function answerLabel(question,value) {
  if(question.type==="numeric") {
    return ({
      haut:"Ligne du haut",
      egal:"Égales",
      bas:"Ligne du bas"
    })[value]||value;
  }
  if(question.type==="spatial") {
    return `Combinaison ${Number(value)+1}`;
  }
  return String(value);
}

function submitAnswer() {
  if(!run||run.finished||run.choice===null)return;

  const correct=run.choice===run.question.answer;

  run.answers.push({
    answer:run.choice,
    expected:run.question.answer,
    correct,
    explanation:run.question.explanation
  });

  if(run.mode==="training") {
    run.feedback=true;
    renderFeedback();
  } else {
    run.index++;
    nextQuestion();
  }
}

function renderFeedback() {
  const q=run.question;
  const result=run.answers[run.answers.length-1];

  app.innerHTML=`
    <div class="panel">
      <div class="small">
        QUESTION ${run.index+1} / ${run.total}
      </div>
      <h1>${result.correct?"Bonne réponse !":"Réponse incorrecte"}</h1>

      <div class="feedback ${result.correct?"correct":"incorrect"}">
        Ta réponse : ${safe(answerLabel(q,result.answer))}
        <br>
        Bonne réponse : ${safe(answerLabel(q,result.expected))}
      </div>

      <h3>Explication</h3>
      <p>${safe(result.explanation)}</p>

      <div class="bottom">
        <button data-action="quit">Quitter</button>
        <button class="primary" data-action="continue">
          ${run.index+1>=run.total?"Voir mon résultat":"Question suivante"}
        </button>
      </div>
    </div>
  `;
  updateTimer();
}

function finish(timeout) {
  if(!run||run.finished)return;

  run.finished=true;
  stopTimer();

  const answered=run.answers.length;
  const correct=run.answers.filter(a=>a.correct).length;
  const percent=Math.round(correct/run.total*100);

  const entry={
    name:NAMES[run.type],
    mode:run.mode,
    date:new Date().toISOString(),
    answered,
    total:run.total,
    correct,
    percent,
    timeout
  };

  history.push(entry);
  if(history.length>200)history=history.slice(-200);
  writeStorage(HISTORY_KEY,history);

  app.innerHTML=`
    <div class="panel center">
      <div class="small">
        ${timeout?"TEMPS ÉCOULÉ":"SESSION TERMINÉE"}
      </div>
      <h1>Ton résultat</h1>
      <div class="big">${correct}/${run.total}</div>
      <h2>${percent}%</h2>

      <p>
        ${answered} question(s) répondues sur ${run.total}.
        <br>
        ${correct} bonne(s) réponse(s).
      </p>

      <div class="row" style="justify-content:center">
        <button class="primary" data-action="restart">
          Recommencer
        </button>
        <button data-action="home">
          Accueil
        </button>
      </div>
    </div>

    <h2>Corrections de la session</h2>
    ${run.answers.map((a,i)=>`
      <div class="panel">
        <strong>Question ${i+1} — ${a.correct?"Correct":"Incorrect"}</strong>
        <p class="small">
          Ta réponse : ${safe(answerLabel({type:
            ["numeric","spatial","memory","reasoning","errors"][run.type]
          },a.answer))}
          <br>
          Attendu : ${safe(answerLabel({type:
            ["numeric","spatial","memory","reasoning","errors"][run.type]
          },a.expected))}
        </p>
        <p>${safe(a.explanation)}</p>
      </div>
    `).join("")}
  `;
}

/* -----------------------------
   BOUTONS ET ÉVÉNEMENTS
----------------------------- */

app.addEventListener("click",event=>{
  const button=event.target.closest("[data-action]");
  if(!button)return;

  const action=button.dataset.action;

  if(action==="home") {
    showHome();
    return;
  }

  if(action==="history") {
    showHistory();
    return;
  }

  if(action==="clear-history") {
    if(confirm("Effacer définitivement les résultats de cet appareil ?")) {
      history=[];
      writeStorage(HISTORY_KEY,history);
      showHistory();
    }
    return;
  }

  if(action==="start") {
    startTest(Number(button.dataset.index));
    return;
  }

  if(action==="quit") {
    if(confirm("Quitter cet entraînement ? La session en cours ne sera pas enregistrée.")) {
      showHome();
    }
    return;
  }

  if(action==="advance") {
    if(!run||run.finished)return;
    run.phase++;
    run.choice=null;
    renderTest();
    return;
  }

  if(action==="choose") {
    if(!run||run.finished)return;
    run.choice=button.dataset.value;
    renderTest();
    return;
  }

  if(action==="submit") {
    submitAnswer();
    return;
  }

  if(action==="continue") {
    if(!run||run.finished)return;
    run.index++;
    nextQuestion();
    return;
  }

  if(action==="restart") {
    if(run)startTest(run.type);
  }
});

app.addEventListener("change",event=>{
  const setting=event.target.dataset.setting;
  if(!setting)return;

  const value=event.target.value;
  prefs[setting]=setting==="mode"?value:Number(value);
  writeStorage(PREF_KEY,prefs);
});

document.getElementById("homeButton").addEventListener("click",()=>{
  if(run&&!run.finished) {
    if(!confirm("Abandonner la session en cours ?"))return;
  }
  showHome();
});

if("serviceWorker" in navigator && location.protocol!=="file:") {
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(error=>{
      console.warn("Mode hors connexion indisponible",error);
    });
  });
}

showHome();
</script>
</body>
</html>
